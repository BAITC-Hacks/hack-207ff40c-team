<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Security at each boundary</title>
  <desc id="desc">The configured appliance protects browser traffic with HTTPS, authenticates both devices using mutual TLS, encrypts the station archive with gocryptfs, and runs installed AI models locally. These controls require deployment configuration.</desc>
  <rect width="1200" height="260" rx="18" fill="#122B43"/>
  <g stroke="#385167"><path d="M300 32V228M600 32V228M900 32V228"/></g>
  <g stroke="#8AD8C6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="126" y="71" width="48" height="36" rx="6"/><path d="M136 71V59a14 14 0 0 1 28 0v12M150 86V93"/>
    <rect x="415" y="60" width="25" height="39" rx="5"/><rect x="460" y="60" width="25" height="39" rx="5"/><path d="M440 72h20m-6-5 6 5-6 5M460 89h-20m6-5-6 5 6 5"/>
    <path d="M750 44 778 55V78c0 19-28 32-28 32s-28-13-28-32V55z"/><rect x="740" y="72" width="20" height="16" rx="3"/><path d="M744 72v-5a6 6 0 0 1 12 0v5"/>
    <rect x="1028" y="53" width="44" height="44" rx="6"/><rect x="1040" y="65" width="20" height="20" rx="2"/><path d="M1039 45v8m11-8v8m11-8v8m-22 44v8m11-8v8m11-8v8m-41-41h8m-8 11h8m-8 11h8m44-22h8m-8 11h8m-8 11h8"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g fill="#FFF" font-size="25" font-weight="700"><text x="150" y="148">HTTPS</text><text x="450" y="148">Mutual TLS</text><text x="750" y="148">Encrypted vault</text><text x="1050" y="148">Local inference</text></g>
    <g fill="#B8CDD9" font-size="19"><text x="150" y="185">Browser ↔ station</text><text x="150" y="212">Private certificate authority</text><text x="450" y="185">Station ↔ worker</text><text x="450" y="212">Both devices prove identity</text><text x="750" y="185">Audio, text and credentials</text><text x="750" y="212">Contents + filenames</text><text x="1050" y="185">Models on your hardware</text><text x="1050" y="212">No cloud AI fallback</text></g>
  </g>
</svg>
